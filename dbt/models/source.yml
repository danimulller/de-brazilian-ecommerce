version: 2

sources:
  - name: raw
    description: >
      Raw data from the Brazilian E-Commerce (Olist) dataset, automatically loaded
      into the PostgreSQL `raw` schema from Kaggle CSV files.
    schema: raw
    tables:
      - name: olist_customers_dataset
        description: Customer data (customer_id, city, state, ZIP code).
        columns:
          - name: customer_id
            description: Unique customer identifier per order.
          - name: customer_unique_id
            description: Real unique customer identifier.
          - name: customer_zip_code_prefix
            description: Customer ZIP code.
          - name: customer_city
            description: Customer city.
          - name: customer_state
            description: Customer state (UF).

      - name: olist_orders_dataset
        description: Orders placed on the Olist platform.
        columns:
          - name: order_id
            description: Unique order identifier.
          - name: customer_id
            description: Foreign key to olist_customers_dataset.
          - name: order_status
            description: "Order status: delivered, shipped, canceled, etc."
          - name: order_purchase_timestamp
            description: Purchase date and time.
          - name: order_approved_at
            description: Payment approval date and time.
          - name: order_delivered_carrier_date
            description: Carrier handoff date.
          - name: order_delivered_customer_date
            description: Customer delivery date.
          - name: order_estimated_delivery_date
            description: Estimated delivery date informed at purchase time.

      - name: olist_order_items_dataset
        description: Items for each order (product, price, freight).
        columns:
          - name: order_id
            description: Foreign key to olist_orders_dataset.
          - name: order_item_id
            description: Item sequence within the order.
          - name: product_id
            description: Foreign key to olist_products_dataset.
          - name: seller_id
            description: Foreign key to olist_sellers_dataset.
          - name: price
            description: Item price.
          - name: freight_value
            description: Item freight value.

      - name: olist_order_payments_dataset
        description: Order payments (installments, payment type).
        columns:
          - name: order_id
            description: Foreign key to olist_orders_dataset.
          - name: payment_sequential
            description: Payment sequence (multiple methods possible).
          - name: payment_type
            description: "Type: credit_card, boleto, voucher, debit_card."
          - name: payment_installments
            description: Number of installments.
          - name: payment_value
            description: Total payment value.

      - name: olist_order_reviews_dataset
        description: Order reviews made by customers.
        columns:
          - name: review_id
            description: Unique review identifier.
          - name: order_id
            description: Foreign key to olist_orders_dataset.
          - name: review_score
            description: Score from 1 to 5.
          - name: review_creation_date
            description: Review creation date.
          - name: review_answer_timestamp
            description: Review response date.

      - name: olist_products_dataset
        description: Product catalog.
        columns:
          - name: product_id
            description: Unique product identifier.
          - name: product_category_name
            description: Product category (in Portuguese).
          - name: product_weight_g
            description: Product weight in grams.
          - name: product_length_cm
            description: Length in cm.
          - name: product_height_cm
            description: Height in cm.
          - name: product_width_cm
            description: Width in cm.

      - name: olist_sellers_dataset
        description: Seller (store) data from the platform.
        columns:
          - name: seller_id
            description: Unique seller identifier.
          - name: seller_zip_code_prefix
            description: Seller ZIP code.
          - name: seller_city
            description: Seller city.
          - name: seller_state
            description: Seller state (UF).

      - name: olist_geolocation_dataset
        description: Geographic coordinates by ZIP code.
        columns:
          - name: geolocation_zip_code_prefix
            description: Reference ZIP code.
          - name: geolocation_lat
            description: Latitude.
          - name: geolocation_lng
            description: Longitude.
          - name: geolocation_city
            description: City.
          - name: geolocation_state
            description: State (UF).

      - name: product_category_name_translation
        description: Product category names translation (PT → EN).
        columns:
          - name: product_category_name
            description: Original name in Portuguese.
          - name: product_category_name_english
            description: Translated name in English.