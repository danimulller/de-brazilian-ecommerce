version: 2

models:
  - name: stg_order_payments
    description: Payments table.
    columns:
      - name: order_id
        description: Unique order identifier.
        tests:
          - unique
          - not_null
          - relationships:
              field: order_id
              to: ref('stg_orders')
      - name: payment_sequential
      - name: payment_type
      - name: payment_installments
      - name: payment_amount