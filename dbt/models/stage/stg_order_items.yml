version: 2

models:
  - name: stg_order_items
    description: Order items table.
    columns:
      - name: order_item_id
        description: Unique order item identifier.
        tests:
          - unique
          - not_null
      - name: order_id
        description: Unique order identifier.
        tests:
          - not_null
          - relationships:
              field: order_id
              to: ref('stg_orders')
      - name: product_id
        description: Unique product identifier.
        tests:
          - not_null
          - relationships:
              field: product_id
              to: ref('stg_products')
      - name: seller_id
        description: Unique seller identifier.
        tests:
          - not_null
          - relationships:
              field: seller_id
              to: ref('stg_sellers')
      - name: shipping_limit_date
        description: Shipping deadline date.
      - name: price_amount
        description: Item value.
      - name: freight_amount
        description: Freight value.